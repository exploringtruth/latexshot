name: Deploy LaTeXShot website
on:
  push:
    branches: [main]
    paths: ['site/**', 'Assets/Icon/LaTeXShot.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Include approved artwork when available
        run: |
          if [ -f Assets/Icon/LaTeXShot.png ]; then cp Assets/Icon/LaTeXShot.png site/LaTeXShot.png; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
