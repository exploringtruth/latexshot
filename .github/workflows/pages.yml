name: Deploy LaTeXShot website
on:
  push:
    branches: [main]
    paths: ['site/**', 'Assets/Icon/LaTeXShot.png', '.github/workflows/pages.yml']
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Include approved artwork when available
        run: |
          if [ -f Assets/Icon/LaTeXShot.png ]; then cp Assets/Icon/LaTeXShot.png site/LaTeXShot.png; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
